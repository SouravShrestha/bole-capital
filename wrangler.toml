name = "bolecapital-prod"
main = ".open-next/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Form rate limiting (src/lib/rateLimiter.ts): 1 submission per key per 60s,
# per Cloudflare location. Bindings aren't inherited by [env.*], so each env
# declares its own. namespace_id must be unique per Cloudflare account.

[env.test]
name = "bolecapital-test"

[[env.test.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 1, period = 60 }

[env.production]
name = "bolecapital-prod"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 1, period = 60 }
